name: CI backend

# Branch work is checked through its pull request; pushes run only on main, after a merge.
# Runs only when something it checks changes, to stay within GitHub's free Actions minutes
# (decided by the user, 11 November 2026); the frontend is in ci-frontend.yml, and the secret
# scan, which runs on every push, in secrets.yml. Also weekly on main, so a change on GitHub's
# side shows before a pull request needs CI (decided by the user, 13 November 2026).
on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'apps/frontend/lib/site/countries.ts'
      - 'infra/**'
      - 'tools/survey/**'
      - 'docs/architecture/source-survey/**'
      - 'docs/architecture/role-survey/**'
      - '.github/scripts/**'
      - '.github/audit-exceptions.json'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'apps/backend/**'
      - 'apps/frontend/lib/site/countries.ts'
      - 'infra/**'
      - 'tools/survey/**'
      - 'docs/architecture/source-survey/**'
      - 'docs/architecture/role-survey/**'
      - '.github/scripts/**'
      - '.github/audit-exceptions.json'
      - '.github/workflows/ci.yml'
  schedule:
    - cron: '17 4 * * 3'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the run it replaces; runs on main are kept.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    # A fixed image: ubuntu-latest became 26.04 on 13 November 2026, which has no build of the
    # Python in apps/backend/.python-version. Change it with that file, in a planned step.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/backend
    # Only the crawl-ownership tests use this database. Production runs PostgreSQL 17.6.
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: aidjobs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # The lock check, Render's build rehearsal and the dependency audit run only when the
      # dependencies or the audit scripts change; the weekly dependency-audit.yml catches new
      # advisories against unchanged files. This file is left out, as most pull requests add tests
      # to its lists; one that edits those three checks is run by hand (Actions, CI backend, Run
      # workflow), which runs them all. A pull request is checked out as its merge with main, and
      # main moves only by merges, so the first parent is what the change is measured against. If
      # that comparison fails, the checks run.
      - name: Dependency files changed
        id: deps
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && git diff --quiet HEAD^1 HEAD -- \
              ':(glob)*.in' ':(glob)*.txt' .python-version pyproject.toml \
              scripts/lock.sh scripts/render_build.sh \
              ../../.github/scripts ../../.github/audit-exceptions.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version-file: apps/backend/.python-version

      # Locked files, every package installed here checked against its hash (security plan, stage
      # 3A, part 3, step 3); the pip that setup-python provides is not, which is why the rehearsal
      # below starts from Python's own pip. The test lock holds Render's set plus the test tools.
      - name: Install dependencies
        id: install
        run: |
          python -m pip install --require-hashes -r build-tools.txt
          python -m pip install --require-hashes --build-constraint build-tools.txt -r requirements-test.txt

      - name: Lint executed suite
        run: >
          ruff check
          tests/test_gate1_safety.py
          tests/test_gate3_contracts.py
          tests/test_gate4_persist.py
          tests/test_gate5_crawl_run.py
          tests/test_reliability_persist.py
          tests/test_outbound_fetch.py
          tests/test_outbound_policy_gaps.py
          tests/test_crawler_politeness.py
          tests/conftest.py
          tests/test_gate6_lifecycle.py
          tests/test_crawl_run_lifecycle.py
          tests/test_expiry.py
          tests/test_job_pages.py
          tests/test_gate7_search.py
          tests/test_gate8_organisations.py
          tests/test_gate9_admin.py
          tests/test_gate10_legacy.py
          tests/test_link_admission.py
          tests/test_detail_reader.py
          tests/test_captured_fields.py
          tests/test_site_reader_fallback.py
          tests/test_unicef_saved_excerpts.py
          tests/test_unicef_sites.py
          tests/test_general_reader_excerpts.py
          tests/test_listing_completeness.py
          tests/test_w39_frequency_early_stop.py
          tests/test_crawl_health.py
          tests/test_fill_rates.py
          tests/test_title_facts.py
          tests/test_title_facts_cache.py
          tests/test_reader_interface.py
          tests/test_canary.py
          tests/test_simulate_extract.py
          tests/test_feed_readers.py
          tests/test_ats_feed_readers.py
          tests/test_countries.py
          tests/test_quality_scorer.py
          tests/test_production_mode.py
          tests/test_data_quality_listing.py
          tests/test_public_surface.py
          tests/test_deadline_parsing.py
          tests/test_a2_parse_off_loop.py
          tests/test_crawl_ownership.py
          tests/test_log_safety.py
          tests/test_stored_crawl_messages.py
          tests/test_public_entries_logging.py
          tests/test_public_error_leaks.py
          tests/test_error_text_guard.py
          tests/test_admin_sources_errors.py
          tests/test_admin_sources_contract.py
          tests/test_admin_crawler_errors.py
          tests/test_admin_crawler_contract.py
          tests/test_crawl_review.py
          tests/test_admin_jobs_errors.py
          tests/test_bulk_delete_safeguards.py
          tests/test_source_lifecycle.py
          tests/test_source_lifecycle_db.py
          tests/test_admin_search_pipeline_errors.py
          tests/test_link_validator_policy.py
          tests/test_admin_session.py
          tests/test_admin_gate.py
          tests/signed_in.py
          tests/test_http_contract.py
          tests/test_db_status_check.py
          tests/test_db_roles.py
          tests/role_grants.py
          scripts/db_readonly_check.py
          scripts/db_role_password.py
          scripts/expiry_preview.py
          app/log_safety.py
          app/errors.py
          app/db_health.py
          app/search_projection.py
          app/title_facts.py
          app/title_facts_cache.py
          crawler_v2/run_handle.py
          crawler_v2/job_pages.py
          crawler_v2/listing_fingerprint.py
          crawler_v2/parse_lock.py
          crawler_v2/readers.py
          crawler_v2/feed_fields.py
          crawler_v2/ats_feeds.py
          crawler_v2/simulate.py
          crawler_v2/rss_crawler.py
          crawler_v2/api_crawler.py
          crawler/plugins
          contracts
          security/admin_auth.py
          app/admin_auth_routes.py

      - name: Executed backend tests
        run: python -m pytest tests/test_gate1_safety.py tests/test_gate3_contracts.py tests/test_gate4_persist.py tests/test_gate5_crawl_run.py tests/test_reliability_persist.py tests/test_outbound_fetch.py tests/test_outbound_policy_gaps.py tests/test_crawler_politeness.py tests/test_gate6_lifecycle.py tests/test_crawl_run_lifecycle.py tests/test_expiry.py tests/test_job_pages.py tests/test_gate7_search.py tests/test_gate8_organisations.py tests/test_gate9_admin.py tests/test_gate10_legacy.py tests/test_link_admission.py tests/test_detail_reader.py tests/test_captured_fields.py tests/test_site_reader_fallback.py tests/test_unicef_saved_excerpts.py tests/test_unicef_sites.py tests/test_general_reader_excerpts.py tests/test_listing_completeness.py tests/test_w39_frequency_early_stop.py tests/test_crawl_health.py tests/test_fill_rates.py tests/test_title_facts.py tests/test_title_facts_cache.py tests/test_reader_interface.py tests/test_canary.py tests/test_simulate_extract.py tests/test_feed_readers.py tests/test_ats_feed_readers.py tests/test_countries.py tests/test_quality_scorer.py tests/test_production_mode.py tests/test_data_quality_listing.py tests/test_public_surface.py tests/test_deadline_parsing.py tests/test_a2_parse_off_loop.py tests/test_log_safety.py tests/test_stored_crawl_messages.py tests/test_public_entries_logging.py tests/test_public_error_leaks.py tests/test_error_text_guard.py tests/test_admin_sources_errors.py tests/test_admin_sources_contract.py tests/test_admin_crawler_errors.py tests/test_admin_crawler_contract.py tests/test_crawl_review.py tests/test_admin_jobs_errors.py tests/test_bulk_delete_safeguards.py tests/test_source_lifecycle.py tests/test_admin_search_pipeline_errors.py tests/test_link_validator_policy.py tests/test_admin_session.py tests/test_admin_gate.py tests/test_http_contract.py tests/test_db_status_check.py tests/test_db_roles.py -q

      # Its own process, with no production database variable, against the service above.
      # Security plan, stage 6: the role files run as they will in Supabase (01 and 02 twice,
      # 02 on an empty copy of production's public tables, 03 read), then the crawl runs as
      # aidjobs_app with only the grants in 02_grants.sql, so a missing grant fails here, and
      # 04 removes the roles. CI's database trusts local connections, so no password is set or
      # checked here; the SCRAM sign-in is rehearsed locally (security plan, stage 6 record).
      # A skipped test fails the step.
      - name: Database roles and crawl ownership tests (PostgreSQL)
        shell: bash
        env:
          SERVER_URL: postgresql://postgres@localhost:5432
          TEST_DATABASE_URL: postgresql://aidjobs_app@localhost:5432/aidjobs_test
          TEST_ADMIN_DATABASE_URL: postgresql://postgres@localhost:5432/aidjobs_test
          TEST_EXPECTED_ROLE: aidjobs_app
        run: |
          unset SUPABASE_DB_URL DATABASE_URL
          run_sql() { psql -X -q -v ON_ERROR_STOP=1 "$@"; }
          roles=../../infra/roles
          run_sql "$TEST_ADMIN_DATABASE_URL" -f "$roles/01_create_roles.sql"
          run_sql "$TEST_ADMIN_DATABASE_URL" -f "$roles/01_create_roles.sql"
          run_sql "$TEST_ADMIN_DATABASE_URL" -c "CREATE DATABASE aidjobs_roles_test"
          run_sql "$SERVER_URL/aidjobs_roles_test" -f tests/sql/role_stub_tables.sql
          run_sql "$SERVER_URL/aidjobs_roles_test" -f "$roles/02_grants.sql"
          run_sql "$SERVER_URL/aidjobs_roles_test" -f "$roles/02_grants.sql"
          run_sql "$SERVER_URL/aidjobs_roles_test" -A -t -F '|' -f "$roles/03_verify.sql" | tee roles-verify.txt
          for line in \
            'table|jobs|aidjobs_app=rawd aidjobs_readonly=r' \
            'table|crawl_locks|aidjobs_app=rawd aidjobs_readonly=r' \
            'table|users|aidjobs_app=- aidjobs_readonly=-' \
            'table|takedowns|aidjobs_app=- aidjobs_readonly=r' \
            'schema|aidjobs_app|public usage=t create=f, database create=f temporary=t'; do
            grep -qxF "$line" roles-verify.txt || { echo "03_verify.sql lacks: $line"; exit 1; }
          done
          test "$(grep -c '^table|' roles-verify.txt)" -eq 39
          run_sql "$TEST_ADMIN_DATABASE_URL" -c "DROP DATABASE aidjobs_roles_test"
          python -m pytest tests/test_crawl_ownership.py tests/test_source_lifecycle_db.py -q -rs -p no:cacheprovider | tee ownership-tests.log
          if grep -qE "[0-9]+ skipped" ownership-tests.log; then
            echo "Crawl ownership tests must not be skipped"
            exit 1
          fi
          count() { psql -X -A -t "$TEST_ADMIN_DATABASE_URL" -c "SELECT count(*) FROM $1"; }
          # 04 refuses while a role has a session, and changes nothing (the review of PR #106).
          psql -X -q "postgresql://aidjobs_readonly@localhost:5432/aidjobs_test" -c "SELECT pg_sleep(10)" &
          for _ in $(seq 50); do
            test "$(count "pg_stat_activity WHERE usename = 'aidjobs_readonly'")" -ge 1 && break
            sleep 0.2
          done
          if run_sql "$TEST_ADMIN_DATABASE_URL" -f "$roles/04_rollback.sql" 2> rollback.err; then
            echo "04_rollback.sql dropped a role with an open session"
            exit 1
          fi
          grep -q "refused: aidjobs_readonly has 1 open session" rollback.err
          test "$(count "pg_roles WHERE rolname LIKE 'aidjobs\_%'")" -eq 2
          run_sql "$TEST_ADMIN_DATABASE_URL" -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE usename = 'aidjobs_readonly'" > /dev/null
          wait || true
          for _ in $(seq 50); do
            test "$(count "pg_stat_activity WHERE usename = 'aidjobs_readonly'")" -eq 0 && break
            sleep 0.2
          done
          run_sql "$TEST_ADMIN_DATABASE_URL" -f "$roles/04_rollback.sql"
          run_sql "$TEST_ADMIN_DATABASE_URL" -f "$roles/04_rollback.sql"
          test "$(count "pg_roles WHERE rolname LIKE 'aidjobs\_%'")" -eq 0

      - name: Audit gate script tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: .
        run: |
          ruff check .github/scripts
          python -m pytest .github/scripts -q -p no:cacheprovider

      # The employer survey's step D: its tests, and the committed organisation list must be exactly
      # what the committed inputs and decisions produce.
      - name: Survey step D
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: .
        run: |
          ruff check tools/survey/dedupe.py tools/survey/test_dedupe.py tools/survey/registers.py tools/survey/test_registers.py
          python -m pytest tools/survey/test_dedupe.py tools/survey/test_registers.py -q -p no:cacheprovider
          python tools/survey/dedupe.py
          git diff --exit-code -- docs/architecture/source-survey/organisations.csv docs/architecture/source-survey/step-d-review.csv

      # The employer survey's step E: its tests, and the committed careers candidates, review list
      # and filled websites must be exactly what the committed extract and decisions produce (no
      # network: the download and the extract run only on the user's machine).
      - name: Survey step E
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: .
        run: |
          ruff check tools/survey/careers.py tools/survey/test_careers.py
          python -m pytest tools/survey/test_careers.py -q -p no:cacheprovider
          python tools/survey/careers.py build
          git diff --exit-code -- docs/architecture/source-survey/careers-candidates.csv docs/architecture/source-survey/careers-review.csv docs/architecture/source-survey/websites-filled.csv docs/architecture/source-survey/first-wave.csv

      # The employer survey's step F: its tests, and the committed confirmed list and systems
      # summary must be exactly what the committed observations and decisions produce (no
      # network: the fetch and the extract run only on the user's machine).
      - name: Survey step F
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: .
        run: |
          ruff check tools/survey/confirm.py tools/survey/test_confirm.py
          python -m pytest tools/survey/test_confirm.py -q -p no:cacheprovider
          python tools/survey/confirm.py build
          git diff --exit-code -- docs/architecture/source-survey/step-f-confirmed.csv docs/architecture/source-survey/step-f-systems.csv

      # The role-content survey (W-54): its tests; the role map must be exactly what the committed
      # counts produce, and the broad layer's committed files, its validation results included,
      # must pass their form check (no advert text, title, address, email or phone number).
      # Reading, measuring, coding and scoring run only on the user's machine.
      - name: Role survey
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: .
        run: |
          ruff check tools/survey/roles.py tools/survey/test_roles.py tools/survey/adverts.py tools/survey/advert_set.py tools/survey/test_adverts.py tools/survey/test_rules.py tools/survey/test_restrictions.py tools/survey/validation.py tools/survey/test_validation.py tools/survey/phase0.py tools/survey/test_phase0.py tools/survey/deep.py tools/survey/test_deep.py tools/survey/library.py tools/survey/test_library.py
          python -m pytest tools/survey/test_roles.py tools/survey/test_adverts.py tools/survey/test_rules.py tools/survey/test_restrictions.py tools/survey/test_validation.py tools/survey/test_phase0.py tools/survey/test_deep.py tools/survey/test_library.py -q -p no:cacheprovider
          python tools/survey/roles.py build
          git diff --exit-code -- docs/architecture/role-survey/role-map.csv
          python tools/survey/library.py build
          git diff --exit-code -- docs/architecture/role-survey/library/
          python tools/survey/adverts.py check
          python tools/survey/validation.py check
          python tools/survey/library.py check

      # The committed lock files must be exactly what scripts/lock.sh produces from the .in files.
      - name: Lock files are up to date
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.deps.outputs.changed == 'true' }}
        run: |
          python -m venv /tmp/lock-tool
          /tmp/lock-tool/bin/python -m pip install --quiet --require-hashes -r lock-tools.txt
          PATH="/tmp/lock-tool/bin:$PATH" bash scripts/lock.sh
          git diff --exit-code -- '*.txt'

      # Render's Build Command in a fresh environment like Render's (Python's bundled pip 24.0 and
      # setuptools 65.5.0), without pip's cache (so sgmllib3k is built from source, as on
      # Render); it must install exactly the lock.
      - name: Rehearse Render's build
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.deps.outputs.changed == 'true' }}
        env:
          PIP_NO_CACHE_DIR: '1'
        run: |
          python -m venv /tmp/render-venv
          /tmp/render-venv/bin/python -m pip --version
          PATH="/tmp/render-venv/bin:$PATH" bash scripts/render_build.sh

      - name: Prepare dependency audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.deps.outputs.changed == 'true' }}
        run: bash ../../.github/scripts/prepare_pypi_audit.sh

      # Security plan, stage 3A, part 3: any finding in an installed package fails, the locked
      # build tools included, unless .github/audit-exceptions.json accepts it. A missing, broken,
      # or incomplete audit also fails.
      - name: Dependency audit gate
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.deps.outputs.changed == 'true' }}
        run: >
          python ../../.github/scripts/audit_gate.py
          --exceptions ../../.github/audit-exceptions.json
          pypi --pip-audit /tmp/audit-tool/bin/pip-audit
          --installed audit/installed-packages.txt
          --runtime-lock requirements.txt
          --output audit/pip-audit.json

      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.deps.outputs.changed == 'true' }}
        continue-on-error: true
        with:
          name: backend-dependency-audit
          path: apps/backend/audit/

