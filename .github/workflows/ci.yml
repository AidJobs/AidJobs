name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint executed suite
        run: >
          ruff check
          tests/test_gate1_safety.py
          tests/test_gate3_contracts.py
          tests/test_gate4_persist.py
          tests/test_gate5_crawl_run.py
          tests/test_reliability_persist.py
          tests/test_outbound_fetch.py
          tests/test_gate6_lifecycle.py
          tests/test_gate7_search.py
          tests/test_gate8_organisations.py
          tests/test_gate9_admin.py
          tests/test_gate10_legacy.py
          tests/test_link_admission.py
          tests/test_detail_reader.py
          tests/test_site_reader_fallback.py
          tests/test_geocoder_backoff.py
          tests/test_production_mode.py
          tests/test_data_quality_listing.py
          app/search_projection.py
          contracts
          security/admin_auth.py
          app/data_quality_logs.py
          app/admin_auth_routes.py

      - name: Executed backend tests
        run: python -m pytest tests/test_gate1_safety.py tests/test_gate3_contracts.py tests/test_gate4_persist.py tests/test_gate5_crawl_run.py tests/test_reliability_persist.py tests/test_outbound_fetch.py tests/test_gate6_lifecycle.py tests/test_gate7_search.py tests/test_gate8_organisations.py tests/test_gate9_admin.py tests/test_gate10_legacy.py tests/test_link_admission.py tests/test_detail_reader.py tests/test_site_reader_fallback.py tests/test_geocoder_backoff.py tests/test_production_mode.py tests/test_data_quality_listing.py -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Frontend tests
        run: npm run test --workspace=@aidjobs/frontend

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Scans only the commits a push or pull request adds. Values in older history were
      # rotated on 23 October 2026 and would fail every run if scanned again.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
