name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    # Only the crawl-ownership tests use this database. Production runs PostgreSQL 17.6.
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: aidjobs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          pip install ruff

      - name: Lint executed suite
        run: >
          ruff check
          tests/test_gate1_safety.py
          tests/test_gate3_contracts.py
          tests/test_gate4_persist.py
          tests/test_gate5_crawl_run.py
          tests/test_reliability_persist.py
          tests/test_outbound_fetch.py
          tests/test_gate6_lifecycle.py
          tests/test_gate7_search.py
          tests/test_gate8_organisations.py
          tests/test_gate9_admin.py
          tests/test_gate10_legacy.py
          tests/test_link_admission.py
          tests/test_detail_reader.py
          tests/test_site_reader_fallback.py
          tests/test_unicef_saved_excerpts.py
          tests/test_geocoder_backoff.py
          tests/test_production_mode.py
          tests/test_data_quality_listing.py
          tests/test_public_surface.py
          tests/test_deadline_parsing.py
          tests/test_crawl_ownership.py
          tests/test_log_safety.py
          tests/test_public_error_leaks.py
          tests/test_error_text_guard.py
          tests/test_admin_sources_errors.py
          tests/test_admin_sources_contract.py
          tests/test_admin_session.py
          tests/test_http_contract.py
          app/log_safety.py
          app/errors.py
          app/search_projection.py
          crawler_v2/run_handle.py
          contracts
          security/admin_auth.py
          app/data_quality_logs.py
          app/admin_auth_routes.py

      - name: Executed backend tests
        run: python -m pytest tests/test_gate1_safety.py tests/test_gate3_contracts.py tests/test_gate4_persist.py tests/test_gate5_crawl_run.py tests/test_reliability_persist.py tests/test_outbound_fetch.py tests/test_gate6_lifecycle.py tests/test_gate7_search.py tests/test_gate8_organisations.py tests/test_gate9_admin.py tests/test_gate10_legacy.py tests/test_link_admission.py tests/test_detail_reader.py tests/test_site_reader_fallback.py tests/test_unicef_saved_excerpts.py tests/test_geocoder_backoff.py tests/test_production_mode.py tests/test_data_quality_listing.py tests/test_public_surface.py tests/test_deadline_parsing.py tests/test_log_safety.py tests/test_public_error_leaks.py tests/test_error_text_guard.py tests/test_admin_sources_errors.py tests/test_admin_sources_contract.py tests/test_admin_session.py tests/test_http_contract.py -q

      # Its own process, with no production database variable, against the service above.
      # A skipped test fails the step.
      - name: Crawl ownership tests (PostgreSQL)
        shell: bash
        env:
          TEST_DATABASE_URL: postgresql://postgres@localhost:5432/aidjobs_test
        run: |
          unset SUPABASE_DB_URL DATABASE_URL
          python -m pytest tests/test_crawl_ownership.py -q -rs -p no:cacheprovider | tee ownership-tests.log
          if grep -qE "[0-9]+ skipped" ownership-tests.log; then
            echo "Crawl ownership tests must not be skipped"
            exit 1
          fi

      # Report only, not a gate (security plan, stage 3A): the exact installed set and what
      # pip-audit knows about it, kept as an artifact. Findings never fail CI; if the audit
      # cannot run, this step shows as failed but the job still passes. The tool runs in its
      # own environment so it is not part of the set it audits.
      - name: Audit installed packages
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p audit
          date -u +%Y-%m-%dT%H:%M:%SZ > audit/audited-at.txt
          python --version >> audit/audited-at.txt
          pip freeze --all > audit/installed-packages.txt
          python -m venv /tmp/audit-tool
          /tmp/audit-tool/bin/pip install --quiet pip-audit==2.10.1
          set +e
          /tmp/audit-tool/bin/pip-audit -r audit/installed-packages.txt --no-deps --disable-pip \
            --progress-spinner off --format json --output audit/pip-audit.json
          code=$?
          set -e
          echo "pip-audit exit code: $code (0 no findings, 1 findings or error)" >> audit/audited-at.txt
          python - <<'EOF' > audit/pip-audit.txt
          import json
          deps = json.load(open("audit/pip-audit.json"))["dependencies"]
          print(f"{len(deps)} packages audited")
          for d in deps:
              for v in d.get("vulns", []):
                  print(d["name"], d["version"], v["id"], "fixed in", ", ".join(v["fix_versions"]) or "-")
          EOF
          cat audit/audited-at.txt audit/pip-audit.txt

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: backend-dependency-audit
          path: apps/backend/audit/

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Frontend tests
        run: npm run test --workspace=@aidjobs/frontend

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Scans only the commits a push or pull request adds. Values in older history were
      # rotated on 23 October 2026 and would fail every run if scanned again.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
