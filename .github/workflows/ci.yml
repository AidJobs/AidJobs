name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint executed suite
        run: >
          ruff check
          tests/test_gate1_safety.py
          tests/test_gate3_contracts.py
          tests/test_gate4_persist.py
          tests/test_gate5_crawl_run.py
          tests/test_gate6_lifecycle.py
          tests/test_gate7_search.py
          tests/test_gate8_organisations.py
          tests/test_gate9_admin.py
          tests/test_gate10_legacy.py
          app/search_projection.py
          contracts
          security/admin_auth.py
          app/data_quality_logs.py
          app/admin_auth_routes.py

      - name: Executed backend tests
        run: python -m pytest tests/test_gate1_safety.py tests/test_gate3_contracts.py tests/test_gate4_persist.py tests/test_gate5_crawl_run.py tests/test_gate6_lifecycle.py tests/test_gate7_search.py tests/test_gate8_organisations.py tests/test_gate9_admin.py tests/test_gate10_legacy.py -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Frontend tests
        run: npm run test --workspace=@aidjobs/frontend
